openwebui:
  base_url: "http://openwebui:8080/api"
  api_key: "YOUR_API_KEY"
  model: "gemma-4-31B-it"
  timeout_sec: 120
  max_tokens: 1024
  max_retries: 2
  retry_backoff_sec: 1
  cleanup_temporary_files: true
  temporary_file_max_age_hours: 24

capture:
  interval_sec: 180
  startup_delay_min: 3
  jpeg_quality: 80
  idle_threshold_sec: 300
  skip_same_screen: true
  same_screen_max_distance: 3
  same_screen_force_after_sec: 900
  skip_unavailable_session: true
  excluded_app_names: []
  excluded_window_titles: []

storage:
  data_dir: "data"
  markdown_enabled: true
  retention_days: 14
  # Existing Obsidian vault root; omit to use data_dir/obsidian.
  # obsidian_vault: "C:/Users/USER/Documents/MyVault"

notes:
  enabled: true
  title_prefix: "PC作業記録"
