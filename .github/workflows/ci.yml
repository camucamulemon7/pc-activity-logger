name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - name: Install dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q pc_activity_logger tests
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Diagnose Qt teardown failure
        if: failure() && runner.os == 'Linux' && matrix.python == '3.10'
        run: |
          sudo apt-get install --no-install-recommends -y gdb
          PYTHONMALLOC=debug python -m unittest discover -s tests -p test_gui.py -q || true
          python - <<'PY'
          import ast
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          tree = ast.parse(Path('tests/test_gui.py').read_text(encoding='utf-8'))
          names = [node.name for node in ast.walk(tree) if isinstance(node, ast.FunctionDef) and node.name.startswith('test_')]
          for name in names:
              result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_gui.py', '-k', name, '-q'], capture_output=True, text=True)
              print(name, 'exit=', result.returncode, flush=True)
              if result.returncode:
                  print(result.stderr[-1800:], flush=True)
          for path in sorted(Path('tests').glob('test_*.py')):
              result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', path.name, '-q'], capture_output=True, text=True)
              print(path.name, 'exit=', result.returncode, flush=True)
              if result.returncode:
                  print(result.stderr[-1800:], flush=True)
          if shutil.which('gdb'):
              subprocess.run(['gdb', '-q', '-batch', '-ex', 'run', '-ex', 'bt', '-ex', 'frame 17', '-ex', 'x/s ((PyASCIIObject*)co->co_name)+1', '-ex', 'x/s ((PyASCIIObject*)co->co_filename)+1', '--args', sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-q'])
          probe = '''import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_gui.py')
          def cases(item):
              for test in item:
                  if isinstance(test, unittest.TestSuite):
                      yield from cases(test)
                  else:
                      yield test
          result = unittest.TextTestRunner(verbosity=0).run(unittest.TestSuite(test for test in cases(suite) if not test.id().endswith('.' + sys.argv[1])))
          sys.exit(not result.wasSuccessful())
          '''
          for name in names:
              result = subprocess.run([sys.executable, '-c', probe, name], capture_output=True, text=True)
              print('without', name, 'exit=', result.returncode, flush=True)
          PY
          python -m pip install 'PySide6>=6.8,<6.12'
          python -m unittest discover -s tests -q
